openapi: 3.1.0
info:
  title: Operador de Cursos DETONA
  version: 1.0.0
  description: API privada para validar, aplicar e verificar bundles de cursos exclusivamente no staging.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://folnsdtmaiksjqqsohjx.supabase.co/functions/v1
    description: Supabase detona-staging
paths:
  /detona-course-provisioner:
    post:
      operationId: operateDetonaCourse
      summary: Executa uma operação segura do provisionador de cursos
      description: |
        Use validate_course_bundle antes de qualquer apply_course_bundle.
        Apply exige o token temporário devolvido pela validação e a frase de confirmação exata.
        A API nunca publica pacotes, concede acesso ou aceita produção.
      x-openai-isConsequential: true
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ValidateRequest'
                - $ref: '#/components/schemas/ApplyRequest'
                - $ref: '#/components/schemas/VerifyRequest'
                - $ref: '#/components/schemas/GetOperationRequest'
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/SafeError'
        '401':
          $ref: '#/components/responses/SafeError'
        '403':
          $ref: '#/components/responses/SafeError'
        '409':
          $ref: '#/components/responses/SafeError'
        '429':
          $ref: '#/components/responses/SafeError'
components:
  securitySchemes:
    developerSession:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: Sessão temporária de uma conta cujo profiles.role seja developer.
  responses:
    SafeError:
      description: Erro sanitizado
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code:
                    type: string
                  message:
                    type: string
  schemas:
    ValidateRequest:
      type: object
      additionalProperties: false
      required: [action, environment, bundle]
      properties:
        action:
          const: validate_course_bundle
        environment:
          const: staging
        bundle:
          $ref: '#/components/schemas/CourseBundle'
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [action, environment, bundle]
      properties:
        action:
          const: verify_course_bundle
        environment:
          const: staging
        bundle:
          $ref: '#/components/schemas/CourseBundle'
    ApplyRequest:
      type: object
      additionalProperties: false
      required: [action, environment, operation_id, bundle, confirmation_token, confirmation]
      properties:
        action:
          const: apply_course_bundle
        environment:
          const: staging
        operation_id:
          $ref: '#/components/schemas/OperationId'
        bundle:
          $ref: '#/components/schemas/CourseBundle'
        confirmation_token:
          type: string
          minLength: 32
          maxLength: 256
          description: Token temporário devolvido por validate_course_bundle.
        confirmation:
          type: string
          minLength: 20
          maxLength: 240
          description: Frase exata devolvida em required_confirmation. Nunca inferir a confirmação.
    GetOperationRequest:
      type: object
      additionalProperties: false
      required: [action, environment, operation_id]
      properties:
        action:
          const: get_course_operation
        environment:
          const: staging
        operation_id:
          $ref: '#/components/schemas/OperationId'
    OperationId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    CourseBundle:
      type: object
      additionalProperties: false
      required: [schema_version, operation_id, contest, curriculum, question_batches, assets]
      properties:
        schema_version:
          const: 1
        operation_id:
          $ref: '#/components/schemas/OperationId'
        contest:
          $ref: '#/components/schemas/Contest'
        curriculum:
          $ref: '#/components/schemas/Curriculum'
        question_batches:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/QuestionBatch'
        assets:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Asset'
    Contest:
      type: object
      additionalProperties: false
      required: [id, code, slug, name, role, description, content_status, sales_status, price_cents, currency, color, accent]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$' }
        code: { type: string, maxLength: 30 }
        slug: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$' }
        name: { type: string, maxLength: 160 }
        role: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 600 }
        content_status: { type: string, enum: [draft, preparing] }
        sales_status: { const: unavailable }
        price_cents: { const: 0 }
        currency: { const: BRL }
        exam_date:
          oneOf:
            - { type: string, format: date }
            - { type: 'null' }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: string, maxLength: 30 }
        cover_asset:
          oneOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
    Curriculum:
      type: object
      additionalProperties: false
      required: [schema_version, contest_id, nodes]
      properties:
        schema_version: { const: 1 }
        contest_id: { type: string }
        nodes:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/CurriculumNode'
    CurriculumNode:
      type: object
      additionalProperties: false
      required: [source_id, parent_source_id, type, name, description, order_index]
      properties:
        source_id: { type: string }
        parent_source_id:
          oneOf:
            - { type: string }
            - { type: 'null' }
        type: { type: string, enum: [role, discipline, topic, subtopic] }
        name: { type: string, maxLength: 240 }
        description:
          oneOf:
            - { type: string, maxLength: 1000 }
            - { type: 'null' }
        order_index: { type: integer, minimum: 0, maximum: 100000 }
    QuestionBatch:
      type: object
      additionalProperties: false
      required: [name, questions]
      properties:
        name: { type: string, maxLength: 160 }
        questions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      additionalProperties: false
      required: [id, contest_id, subtopic_id, statement, correct_answer, explanation]
      properties:
        id: { type: string }
        contest_id: { type: string }
        subtopic_id: { type: string }
        statement: { type: string, maxLength: 10000 }
        options:
          type: array
          items: {}
        correct_answer:
          oneOf:
            - { type: boolean }
            - { type: string, enum: [C, E, Certo, Errado] }
        explanation: { type: string, maxLength: 20000 }
        difficulty: {}
        source: {}
        is_trick: { type: boolean }
    Asset:
      type: object
      additionalProperties: false
      required: [slot, name, mime_type, content_base64]
      properties:
        slot: { type: string, enum: [battle_avatar, success, error, attention, cover] }
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*\.(png|webp)$' }
        mime_type: { type: string, enum: [image/png, image/webp] }
        content_base64:
          type: string
          format: byte
          maxLength: 11184816
          description: Conteúdo integral do PNG ou WebP em Base64. battle_avatar é obrigatório.
