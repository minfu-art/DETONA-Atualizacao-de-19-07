name: PC BA Batch 001 Plan

on:
  push:
    branches:
      - codex/pc-ba-investigador-batch-001

permissions:
  contents: write

jobs:
  plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/pc-ba-investigador-batch-001

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate first 100 priority contracts
        run: npm run qf:plan -- --course pc-ba-2026-investigador --limit 100

      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-packages/pc-ba-2026-investigador/factory/contracts/
          if git diff --cached --quiet; then
            echo "No contract changes generated"
            exit 0
          fi
          git commit -m "chore(question-factory): plan PC BA Investigator batch 001"
          git push origin HEAD:codex/pc-ba-investigador-batch-001
