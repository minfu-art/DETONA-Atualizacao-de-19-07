openapi: 3.0.3
info:
  title: Operador de Cursos DETONA
  version: 1.0.1
  description: API privada para validar, aplicar e verificar bundles de cursos exclusivamente no staging.
  license:
    name: Proprietary
    url: https://github.com/minfu-art/DETONA-Atualizacao-de-19-07
servers:
  - url: https://folnsdtmaiksjqqsohjx.supabase.co/functions/v1
    description: Supabase detona-staging
paths:
  /detona-course-provisioner:
    post:
      operationId: operateDetonaCourse
      summary: Executa uma operação segura do provisionador de cursos
      description: |
        Use validate_course_bundle antes de qualquer apply_course_bundle.
        Apply exige o token temporário devolvido pela validação e a frase de confirmação exata.
        A API nunca publica pacotes, concede acesso ou aceita produção.
      x-openai-isConsequential: true
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
                - environment
              properties:
                action:
                  type: string
                  enum:
                    - validate_course_bundle
                    - apply_course_bundle
                    - verify_course_bundle
                    - get_course_operation
                  description: |
                    validate_course_bundle e verify_course_bundle exigem bundle.
                    get_course_operation exige operation_id.
                    apply_course_bundle exige operation_id, bundle, confirmation_token e confirmation.
                environment:
                  type: string
                  enum:
                    - staging
                  description: O único ambiente aceito é staging.
                operation_id:
                  $ref: '#/components/schemas/OperationId'
                bundle:
                  $ref: '#/components/schemas/CourseBundle'
                confirmation_token:
                  type: string
                  minLength: 32
                  maxLength: 256
                  description: Obrigatório somente em apply_course_bundle. Use o token temporário devolvido pela validação.
                confirmation:
                  type: string
                  minLength: 20
                  maxLength: 240
                  description: Obrigatória somente em apply_course_bundle. Envie exatamente a frase retornada em required_confirmation.
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  result:
                    type: string
                  bundle:
                    $ref: '#/components/schemas/CourseSummary'
                  report:
                    $ref: '#/components/schemas/VerificationReport'
                  operation:
                    $ref: '#/components/schemas/OperationResponse'
                  confirmation_token:
                    type: string
                  confirmation_expires_at:
                    type: string
                    format: date-time
                  required_confirmation:
                    type: string
        '400':
          $ref: '#/components/responses/SafeError'
        '401':
          $ref: '#/components/responses/SafeError'
        '403':
          $ref: '#/components/responses/SafeError'
        '404':
          $ref: '#/components/responses/SafeError'
        '409':
          $ref: '#/components/responses/SafeError'
        '429':
          $ref: '#/components/responses/SafeError'
components:
  securitySchemes:
    developerSession:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: Sessão temporária de uma conta cujo profiles.role seja developer.
  responses:
    SafeError:
      description: Erro sanitizado
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
  schemas:
    OperationId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    CourseSummary:
      type: object
      additionalProperties: true
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        contest_id:
          type: string
        code:
          type: string
        slug:
          type: string
        curriculum_nodes:
          type: integer
        roles:
          type: integer
        disciplines:
          type: integer
        topics:
          type: integer
        subtopics:
          type: integer
        batches:
          type: integer
        questions:
          type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
    AssetSummary:
      type: object
      additionalProperties: true
      properties:
        slot:
          type: string
        name:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
        hash:
          type: string
    VerificationReport:
      type: object
      additionalProperties: true
      properties:
        exact:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        contest:
          $ref: '#/components/schemas/ContestComparison'
        curriculum:
          $ref: '#/components/schemas/CurriculumComparison'
        questions:
          $ref: '#/components/schemas/QuestionComparison'
        assets:
          $ref: '#/components/schemas/AssetComparisons'
        appearance_status:
          type: string
          nullable: true
        packages:
          $ref: '#/components/schemas/PublicationCount'
        versions:
          $ref: '#/components/schemas/PublicationCount'
        publication_ready:
          type: boolean
        steps:
          $ref: '#/components/schemas/OperationSteps'
        entitlements_created:
          type: integer
        packages_published:
          type: integer
    ContestComparison:
      type: object
      additionalProperties: true
      properties:
        exists:
          type: boolean
        matches:
          type: boolean
    CurriculumComparison:
      type: object
      additionalProperties: true
      properties:
        local:
          type: integer
        remote:
          type: integer
        matches:
          type: boolean
    QuestionComparison:
      type: object
      additionalProperties: true
      properties:
        bundle:
          type: integer
        remote:
          type: integer
        matching:
          type: integer
        missing:
          type: integer
        differing:
          type: integer
        extra:
          type: integer
    AssetComparisons:
      type: object
      additionalProperties: true
      properties:
        battle_avatar:
          $ref: '#/components/schemas/AssetComparison'
        success:
          $ref: '#/components/schemas/AssetComparison'
        error:
          $ref: '#/components/schemas/AssetComparison'
        attention:
          $ref: '#/components/schemas/AssetComparison'
        cover:
          $ref: '#/components/schemas/AssetComparison'
    AssetComparison:
      type: object
      additionalProperties: true
      properties:
        exists:
          type: boolean
        selected:
          type: boolean
        hash:
          type: string
    PublicationCount:
      type: object
      additionalProperties: true
      properties:
        total:
          type: integer
        published:
          type: integer
    OperationSteps:
      type: object
      additionalProperties: true
      properties:
        contest_created:
          type: boolean
        curriculum_imported:
          type: boolean
        assets_registered:
          type: boolean
        questions_imported:
          type: boolean
        verified:
          type: boolean
    OperationResponse:
      type: object
      additionalProperties: true
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        contest_id:
          type: string
        bundle_hash:
          type: string
        status:
          type: string
        summary:
          $ref: '#/components/schemas/CourseSummary'
        report:
          $ref: '#/components/schemas/VerificationReport'
        steps:
          $ref: '#/components/schemas/OperationSteps'
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    CourseBundle:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - operation_id
        - contest
        - curriculum
        - question_batches
        - assets
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        operation_id:
          $ref: '#/components/schemas/OperationId'
        contest:
          $ref: '#/components/schemas/Contest'
        curriculum:
          $ref: '#/components/schemas/Curriculum'
        question_batches:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/QuestionBatch'
        assets:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Asset'
    Contest:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - slug
        - name
        - role
        - description
        - content_status
        - sales_status
        - price_cents
        - currency
        - color
        - accent
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$'
        code:
          type: string
          maxLength: 30
        slug:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$'
        name:
          type: string
          maxLength: 160
        role:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 600
        content_status:
          type: string
          enum:
            - draft
            - preparing
        sales_status:
          type: string
          enum:
            - unavailable
        price_cents:
          type: integer
          enum:
            - 0
        currency:
          type: string
          enum:
            - BRL
        exam_date:
          type: string
          format: date
          nullable: true
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        accent:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        icon:
          type: string
          maxLength: 30
        cover_asset:
          type: string
          maxLength: 500
          nullable: true
    Curriculum:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - contest_id
        - nodes
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        contest_id:
          type: string
        nodes:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/CurriculumNode'
    CurriculumNode:
      type: object
      additionalProperties: false
      required:
        - source_id
        - parent_source_id
        - type
        - name
        - description
        - order_index
      properties:
        source_id:
          type: string
        parent_source_id:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - role
            - discipline
            - topic
            - subtopic
        name:
          type: string
          maxLength: 240
        description:
          type: string
          maxLength: 1000
          nullable: true
        order_index:
          type: integer
          minimum: 0
          maximum: 100000
    QuestionBatch:
      type: object
      additionalProperties: false
      required:
        - name
        - questions
      properties:
        name:
          type: string
          maxLength: 160
        questions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      additionalProperties: false
      required:
        - id
        - contest_id
        - subtopic_id
        - statement
        - correct_answer
        - explanation
      properties:
        id:
          type: string
        contest_id:
          type: string
        subtopic_id:
          type: string
        statement:
          type: string
          maxLength: 10000
        options:
          type: array
          items: {}
        correct_answer:
          oneOf:
            - type: boolean
            - type: string
              enum:
                - C
                - E
                - Certo
                - Errado
        explanation:
          type: string
          maxLength: 20000
        difficulty: {}
        source: {}
        is_trick:
          type: boolean
    Asset:
      type: object
      additionalProperties: false
      required:
        - slot
        - name
        - mime_type
        - content_base64
      properties:
        slot:
          type: string
          enum:
            - battle_avatar
            - success
            - error
            - attention
            - cover
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*\.(png|webp)$'
        mime_type:
          type: string
          enum:
            - image/png
            - image/webp
        content_base64:
          type: string
          format: byte
          maxLength: 11184816
          description: Conteúdo integral do PNG ou WebP em Base64. battle_avatar é obrigatório.
