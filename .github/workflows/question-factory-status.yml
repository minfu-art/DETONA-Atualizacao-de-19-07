name: Question Factory Status

on:
  workflow_dispatch:
    inputs:
      course:
        description: Course package slug
        required: true
        default: pc-ba-2026-investigador
      top:
        description: Number of priority gaps to show
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Coverage status
        run: npm run qf:status -- --course "${{ inputs.course }}" --top "${{ inputs.top }}"
