name: Question Factory Status

on:
  push:
    branches:
      - codex/question-factory-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: PC BA Investigator coverage status
        run: npm run qf:status -- --course pc-ba-2026-investigador --top 30
